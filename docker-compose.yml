# ==============================================================================
# ReadBox Production Stack (PostgreSQL 16 + Next.js Web + Maildir Worker)
# R-03 SMTP+LMTP containers are OPT-IN (--profile mailserver), not implicit services.
# Default SMTP bind 127.0.0.1:25; explicit external-network approval required to expose it.
# Default docker compose now selects THIS file; compose.dev.yaml is opt-in development.
#
# Postfix / Dovecot Host or Sidecar Integration Contract:
# 1. Mount the `readbox_vmail` volume (or bind-mount `/var/vmail`) into both
#    Postfix/Dovecot (UID/GID owning Maildir) and the `web` + `worker` services.
# 2. Point Postfix pgsql virtual maps (`deployment/templates/postfix/*.cf.tpl`)
#    to the single PostgreSQL database (`mailserver.postfix_virtual_domains`,
#    `mailserver.postfix_virtual_mailboxes`, `mailserver.postfix_virtual_aliases`).
# ==============================================================================

services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-readbox}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB:?Coolify auto-generates SERVICE_PASSWORD_DB}
      POSTGRES_DB: ${POSTGRES_DB:-readbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - readbox_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-readbox} -d $${POSTGRES_DB:-readbox}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  web:
    user: "1001:1001"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      dkim-provisioner:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DOCKER_RUNTIME: "true"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      # Database & Migrations: runtime encodes arbitrary DB password bytes safely.
      READBOX_DB_USER: ${POSTGRES_USER:-readbox}
      READBOX_DB_NAME: ${POSTGRES_DB:-readbox}
      READBOX_DB_PASSWORD: ${SERVICE_PASSWORD_DB:?Set SERVICE_PASSWORD_DB in .env or Coolify}
      PRISMA_CLI_ALLOW_REMOTE: "true"

      # Authentication & Proxy Trust (Coolify auto-generates SERVICE_BASE64_64_SECRET)
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${SERVICE_BASE64_64_SECRET:?Coolify auto-generates SERVICE_BASE64_64_SECRET}
      # QIS-01 owner code is never stored in plaintext; only hash/expiry enter web.
      READBOX_SETUP_TOKEN_SHA256: ${READBOX_SETUP_TOKEN_SHA256:-}
      READBOX_SETUP_TOKEN_EXPIRES_AT: ${READBOX_SETUP_TOKEN_EXPIRES_AT:-}
      CONTACT_SECRET_KEY: ${CONTACT_SECRET_KEY:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      AUTH_URL: ${AUTH_URL:-}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-}
      DEV_AUTH_MODE: "off"
      DEV_AUTH_ROLE: "user"

      # Login Lockout & Logging
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Mail Domain & Host Configuration (configure in Coolify UI for your domain)
      MAIL_DOMAIN: ${MAIL_DOMAIN:-readbox.local}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.readbox.local}
      APP_HOSTNAME: ${APP_HOSTNAME:-app.readbox.local}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
      DNS_LOOKUP_TIMEOUT_SECONDS: ${DNS_LOOKUP_TIMEOUT_SECONDS:-3}

      # Persistent Storage Paths (backed by named volumes below)
      MAIL_STORAGE_ROOT: /var/vmail
      MAILDIR_UID: "1001"
      MAILDIR_GID: "1001"
      ATTACHMENT_STORAGE_ROOT: /var/lib/readbox/attachments
      MEDIA_ROOT: /var/lib/readbox/media
      MAILBOX_PROVISION_LOCK_ROOT: /var/lock/readbox-provision
      OPENDKIM_KEYS_ROOT: /etc/opendkim/keys
      INGESTION_LOCK_FILE: /var/lock/readbox-provision/readbox-ingestion.lock
      UPDATE_RUNTIME_DIR: /run/readbox

      # Mailbox, Retention & Readiness Policy
      MAILBOX_DEFAULT_QUOTA_BYTES: ${MAILBOX_DEFAULT_QUOTA_BYTES:-2147483648}
      INGESTION_STALE_AFTER_SECONDS: ${INGESTION_STALE_AFTER_SECONDS:-120}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-15}
      REQUIRE_INGESTION_READY: ${REQUIRE_INGESTION_READY:-false}
      MAX_MESSAGE_SIZE_MB: ${MAX_MESSAGE_SIZE_MB:-25}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-20}
      MAX_ATTACHMENTS_PER_MESSAGE: ${MAX_ATTACHMENTS_PER_MESSAGE:-25}
      USE_X_ACCEL_REDIRECT: ${USE_X_ACCEL_REDIRECT:-false}

      # Optional Release Check Settings
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-vibtools/ReadBox}
      READBOX_CF_DNS_TOKEN: ${READBOX_CF_DNS_TOKEN:-}
      READBOX_CF_DNS_ZONE_ID: ${READBOX_CF_DNS_ZONE_ID:-}
      READBOX_CF_DNS_ZONE_NAME: ${READBOX_CF_DNS_ZONE_NAME:-}
    volumes:
      - readbox_vmail:/var/vmail
      - readbox_attachments:/var/lib/readbox/attachments
      - readbox_media:/var/lib/readbox/media
      - readbox_locks:/var/lock/readbox-provision
      - readbox_opendkim:/etc/opendkim/keys:ro
      - readbox_dkim_ipc:/run/readbox-dkim:ro
      - readbox_backup_ipc:/run/readbox-backup-agent:ro
      # AU-01: restricted HMAC Unix socket only; NOT the Docker socket.
      - readbox_update_ipc:/run/readbox-updater:ro
    networks:
      - readbox_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  worker:
    user: "1001:1001"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    command:
      - "node"
      - "--conditions=react-server"
      - "--import"
      - "tsx"
      - "scripts/mail/ingest.ts"
      - "--watch"
      - "--interval"
      - "${INGESTION_INTERVAL_SECONDS:-15}"
    environment:
      NODE_ENV: production
      DOCKER_RUNTIME: "true"
      SKIP_MIGRATIONS: "true"
      READBOX_DB_USER: ${POSTGRES_USER:-readbox}
      READBOX_DB_NAME: ${POSTGRES_DB:-readbox}
      READBOX_DB_PASSWORD: ${SERVICE_PASSWORD_DB:?Set SERVICE_PASSWORD_DB in .env or Coolify}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${SERVICE_BASE64_64_SECRET:?Coolify auto-generates SERVICE_BASE64_64_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-readbox.local}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.readbox.local}
      APP_HOSTNAME: ${APP_HOSTNAME:-app.readbox.local}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
      MAIL_STORAGE_ROOT: /var/vmail
      MAILDIR_UID: "1001"
      MAILDIR_GID: "1001"
      ATTACHMENT_STORAGE_ROOT: /var/lib/readbox/attachments
      MEDIA_ROOT: /var/lib/readbox/media
      MAILBOX_PROVISION_LOCK_ROOT: /var/lock/readbox-provision
      OPENDKIM_KEYS_ROOT: /etc/opendkim/keys
      INGESTION_LOCK_FILE: /var/lock/readbox-provision/readbox-ingestion.lock
      INGESTION_STALE_AFTER_SECONDS: ${INGESTION_STALE_AFTER_SECONDS:-120}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-15}
      MAX_MESSAGE_SIZE_MB: ${MAX_MESSAGE_SIZE_MB:-25}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-20}
      MAX_ATTACHMENTS_PER_MESSAGE: ${MAX_ATTACHMENTS_PER_MESSAGE:-25}
    volumes:
      - readbox_vmail:/var/vmail
      - readbox_attachments:/var/lib/readbox/attachments
      - readbox_media:/var/lib/readbox/media
      - readbox_locks:/var/lock/readbox-provision
    networks:
      - readbox_internal
    healthcheck:
      # App web liveness must remain independent to avoid worker startup deadlock.
      # Worker health also requires the app's *full* DB/storage/ingestion readiness.
      test: ["CMD-SHELL", "pgrep -f 'scripts/mail/ingest.ts' >/dev/null && node -e \"fetch('http://web:3000/health/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # R-03: Dovecot LMTP uses only the internal Compose network.
  # The same Maildir volume is shared with web+worker (numeric UID/GID 1001).
  dovecot:
    profiles: ["mailserver"]
    build:
      context: .
      dockerfile: deployment/mailserver/dovecot/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-readbox.local}
      VMAIL_UID: "1001"
      VMAIL_GID: "1001"
    volumes:
      - readbox_vmail:/var/vmail
    expose:
      - "24"
    networks:
      - readbox_internal

  # DKIM-01: no network, no SMTP signer, no DNS provider credentials.
  # Only this container can mount persistent PRIVATE key material.
  dkim-provisioner:
    build:
      context: .
      dockerfile: deployment/dkim/Dockerfile
    restart: unless-stopped
    user: "1001:1001"
    network_mode: "none"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    volumes:
      - readbox_dkim_private:/var/lib/readbox-dkim/private
      - readbox_opendkim:/etc/opendkim/keys
      - readbox_dkim_ipc:/run/readbox-dkim
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,stat; p=pathlib.Path('/run/readbox-dkim/agent.sock'); t=pathlib.Path('/run/readbox-dkim/access.token'); assert stat.S_ISSOCK(p.stat().st_mode) and stat.S_ISREG(t.stat().st_mode)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # R-03: inbound SMTP ONLY; no AUTH/587/465/IMAP or outbound relay.
  # Bind loopback by default; a separate approved VPS install may set
  # SMTP_BIND_ADDRESS=0.0.0.0 after public port/TLS/DNS checks.
  postfix:
    profiles: ["mailserver"]
    build:
      context: .
      dockerfile: deployment/mailserver/postfix/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      dovecot:
        condition: service_healthy
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.readbox.local}
      POSTFIX_DB_HOST: postgres
      POSTFIX_DB_PORT: "5432"
      PG_DB_NAME: ${POSTGRES_DB:-readbox}
      POSTFIX_LOOKUP_PASSWORD: ${POSTFIX_LOOKUP_PASSWORD:-}
      MAIL_TLS_DIR: /run/readbox/tls
    volumes:
      - readbox_postfix_queue:/var/spool/postfix
      - ${MAIL_TLS_DIR:-./deployment/mailserver/tls-not-configured}:/run/readbox/tls:ro
    ports:
      - "${SMTP_BIND_ADDRESS:-127.0.0.1}:${SMTP_PUBLISHED_PORT:-25}:25"
    networks:
      - readbox_internal

  # One-shot private-network Postfix lookup password setup, opt-in only.
  postfix-db-credential:
    image: postgres:16.14-alpine
    profiles: ["postfix-setup"]
    restart: "no"
    depends_on:
      web:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-readbox}
      PGDATABASE: ${POSTGRES_DB:-readbox}
      PGPASSWORD: ${SERVICE_PASSWORD_DB:?Set SERVICE_PASSWORD_DB in .env or Coolify}
      POSTFIX_LOOKUP_PASSWORD: ${POSTFIX_LOOKUP_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${#POSTFIX_LOOKUP_PASSWORD}" -lt 24 ]; then
          echo "[r02] Postfix lookup password is missing or too short." >&2
          exit 1
        fi
        psql -q -v ON_ERROR_STOP=1 <<'SQL'
        \getenv postfix_password POSTFIX_LOOKUP_PASSWORD
        SET password_encryption = 'scram-sha-256';
        SET log_statement = 'none';
        ALTER ROLE "readbox_postfix" PASSWORD :'postfix_password';
        SQL
    networks:
      - readbox_internal

volumes:
  postgres_data:
  readbox_vmail:
  readbox_attachments:
  readbox_media:
  readbox_locks:
  readbox_opendkim:
  # DKIM-01: web mounts public-only keys; private material is never mounted there.
  readbox_dkim_private:
  readbox_dkim_ipc:
  readbox_postfix_queue:
  # BR-02: private Unix socket only; no Docker daemon mount.
  readbox_backup_ipc:
  # AU-01 host bridge; kept separate from backup IPC and Docker daemon.
  readbox_update_ipc:

networks:
  readbox_internal:
    driver: bridge
